version: '3.8'

services:
  # ==========================================
  # SERVICIOS DE DATOS BASE
  # ==========================================
  db:
    image: mysql:8.0
    container_name: rosaura_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_IDENTITY_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "3306:3306" # Expuesto para que los VPS 2 y 3 puedan conectarse (Asegurar con Firewall/VPC)
    volumes:
      - db_data:/var/lib/mysql
      - ../docker/mysql/init:/docker-entrypoint-initdb.d 
    networks:
      - rosaura_data_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: rosaura_redis
    restart: always
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    command: redis-server --requirepass "${REDIS_PASS}"
    env_file:
      - ../.env
    ports:
      - "6379:6379" # Expuesto para App Nodes (Sesiones y Caché)
    volumes:
      - redis_data:/data
    networks:
      - rosaura_data_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: rosaura_typesense
    restart: always
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
    ports:
      - "8108:8108" # Expuesto para App Nodes y Frontend
    volumes:
      - typesense_data:/data
    networks:
      - rosaura_data_network

  # ==========================================
  # SERVICIO DE STORAGE (MINIO / S3)
  # ==========================================
  minio:
    image: minio/minio
    container_name: rosaura_minio
    restart: always
    ports:
      - "9000:9000" # API (Donde los App Nodes guardan/leen archivos)
      - "9001:9001" # Consola Web de Administración
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123456}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - rosaura_data_network

  # ==========================================
  # SERVIDOR WEBSOCKET
  # ==========================================
  websocket_server:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_websocket_server
    restart: always
    command: python -u scripts/websocket_server.py
    volumes:
      - ../:/app
    ports:
      - "${WS_PORT:-8765}:${WS_PORT:-8765}"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
      - REDIS_HOST=redis
    networks:
      - rosaura_data_network

  # ==========================================
  # ==========================================
  worker_backups:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_backups
    restart: always
    command: python -u scripts/worker_backups.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_data_network

  worker_system_tasks:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_system_tasks
    restart: always
    command: python -u scripts/worker_system_tasks.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_data_network

  worker_persistence:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_persistence
    restart: always
    command: python -u scripts/worker_persistence.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_data_network

  worker_canvas_jobs:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_canvas_jobs
    restart: always
    command: python -u scripts/worker_canvas_jobs.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_data_network

networks:
  rosaura_data_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  typesense_data:
  minio_data:
