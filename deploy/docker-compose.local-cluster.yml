services:
  # ==========================================
  # LOAD BALANCER
  # ==========================================
  lb:
    image: nginx:alpine
    container_name: rosaura_local_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - rosaura_local_network

  # ==========================================
  # WEB NODES (VPS Simulados)
  # ==========================================
  app1:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile
    container_name: rosaura_app1
    restart: always
    volumes:
      - ../:/var/www/html
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
      - DB_HOST=db
      - REDIS_HOST=redis
      - TYPESENSE_HOST=typesense
      - AWS_ENDPOINT=minio:9000
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rosaura_local_network

  app2:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile
    container_name: rosaura_app2
    restart: always
    volumes:
      - ../:/var/www/html
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
      - DB_HOST=db
      - REDIS_HOST=redis
      - TYPESENSE_HOST=typesense
      - AWS_ENDPOINT=minio:9000
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rosaura_local_network

  # ==========================================
  # DATA NODE (VPS Simulado)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: rosaura_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_IDENTITY_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../docker/mysql/init:/docker-entrypoint-initdb.d 
    networks:
      - rosaura_local_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: rosaura_redis
    restart: always
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    command: redis-server --requirepass "${REDIS_PASS}"
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rosaura_local_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: rosaura_typesense
    restart: always
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - rosaura_local_network

  minio:
    image: minio/minio
    container_name: rosaura_minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000" 
      - "127.0.0.1:9001:9001" 
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-password}
    entrypoint: >
      /bin/sh -c "
      (/bin/sh -c '
        sleep 5;
        /usr/bin/mc alias set myminio http://localhost:9000 $${AWS_ACCESS_KEY_ID:-admin} $${AWS_SECRET_ACCESS_KEY:-password};
        /usr/bin/mc mb myminio/$${AWS_BUCKET:-rosaura-storage} || true;
        /usr/bin/mc anonymous set download myminio/$${AWS_BUCKET:-rosaura-storage} || true;
      ') &
      exec /usr/bin/docker-entrypoint.sh minio server /data --console-address ':9001'
      "
    volumes:
      - minio_data:/data
    networks:
      - rosaura_local_network

  websocket_node:
    build:
      context: ../
      dockerfile: docker/rust/Dockerfile.worker
    container_name: rosaura_websocket_node_rust
    restart: always
    ports:
      - "${WS_PORT:-8765}:${WS_PORT:-8765}"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - ../.env.ws
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_local_network

  worker_backups:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_backups
    restart: always
    command: python -u scripts/workers/worker_backups.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
      db_cassandra:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_local_network

  worker_system_tasks:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_system_tasks
    restart: always
    command: python -u scripts/workers/worker_system_tasks.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_local_network

  worker_persistence:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_persistence
    restart: always
    command: python -u scripts/workers/worker_persistence.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
      db_cassandra:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_local_network

  worker_canvas_jobs:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_canvas_jobs
    restart: always
    command: python -u scripts/workers/worker_canvas_jobs.py
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - rosaura_local_network

  db_cassandra:
    image: cassandra:4.1
    container_name: rosaura_db_cassandra
    restart: always
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - rosaura_local_network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

networks:
  rosaura_local_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  typesense_data:
  minio_data:
  cassandra_data:
