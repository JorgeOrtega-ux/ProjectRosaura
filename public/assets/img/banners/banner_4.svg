<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <defs>
        <!-- Background -->
        <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#040711"/>
            <stop offset="50%" stop-color="#070d1e"/>
            <stop offset="100%" stop-color="#0e172e"/>
        </linearGradient>

        <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>

        <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>

        <!-- Ambient Core Glow -->
        <radialGradient id="cyberGlow" cx="70%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
            <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Canvas Base -->
    <rect width="1200" height="320" fill="url(#cyberBg)"/>
    <rect width="1200" height="320" fill="url(#cyberGlow)"/>

    <!-- Perspective Isometric Mesh Grid -->
    <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" fill="none">
        <!-- Horizontal horizon grid lines -->
        <line x1="0" y1="320" x2="1200" y2="320"/>
        <line x1="0" y1="280" x2="1200" y2="280"/>
        <line x1="0" y1="245" x2="1200" y2="245"/>
        <line x1="0" y1="215" x2="1200" y2="215"/>
        <line x1="0" y1="190" x2="1200" y2="190"/>
        <line x1="0" y1="170" x2="1200" y2="170"/>

        <!-- Perspective vanishing lines toward center-right -->
        <line x1="-100" y1="320" x2="850" y2="140"/>
        <line x1="100" y1="320" x2="850" y2="140"/>
        <line x1="300" y1="320" x2="850" y2="140"/>
        <line x1="500" y1="320" x2="850" y2="140"/>
        <line x1="700" y1="320" x2="850" y2="140"/>
        <line x1="900" y1="320" x2="850" y2="140"/>
        <line x1="1100" y1="320" x2="850" y2="140"/>
        <line x1="1300" y1="320" x2="850" y2="140"/>
    </g>

    <!-- Constellation Node Graph -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" fill="none">
        <!-- Interconnected Lines -->
        <line x1="720" y1="120" x2="820" y2="70"/>
        <line x1="820" y1="70" x2="940" y2="100"/>
        <line x1="940" y1="100" x2="1040" y2="50"/>
        <line x1="940" y1="100" x2="910" y2="210"/>
        <line x1="820" y1="70" x2="910" y2="210"/>
        <line x1="720" y1="120" x2="760" y2="230"/>
        <line x1="760" y1="230" x2="910" y2="210"/>
        <line x1="910" y1="210" x2="1060" y2="180"/>
        <line x1="1040" y1="50" x2="1060" y2="180"/>
        <line x1="1060" y1="180" x2="1140" y2="220"/>
    </g>

    <!-- Glowing Constellation Nodes -->
    <g>
        <circle cx="720" cy="120" r="4" fill="url(#neonCyan)"/>
        <circle cx="820" cy="70" r="5" fill="#38bdf8"/>
        <circle cx="940" cy="100" r="6" fill="url(#neonViolet)"/>
        <circle cx="1040" cy="50" r="4" fill="#818cf8"/>
        <circle cx="760" cy="230" r="3.5" fill="#06b6d4"/>
        <circle cx="910" cy="210" r="5.5" fill="url(#neonCyan)"/>
        <circle cx="1060" cy="180" r="4.5" fill="url(#neonViolet)"/>
        <circle cx="1140" cy="220" r="3" fill="#38bdf8"/>

        <!-- Orbital Rings on main node -->
        <circle cx="940" cy="100" r="16" fill="none" stroke="#c084fc" stroke-width="0.75" stroke-dasharray="3 3" stroke-opacity="0.6"/>
        <circle cx="940" cy="100" r="24" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    </g>

    <!-- Technical UI HUD Elements -->
    <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" fill="none">
        <!-- Target Reticle (Left) -->
        <g transform="translate(180, 100)">
            <circle cx="0" cy="0" r="22" stroke-dasharray="8 4"/>
            <circle cx="0" cy="0" r="6"/>
            <line x1="-30" y1="0" x2="-12" y2="0"/>
            <line x1="12" y1="0" x2="30" y2="0"/>
            <line x1="0" y1="-30" x2="0" y2="-12"/>
            <line x1="0" y1="12" x2="0" y2="30"/>
            <text x="35" y="4" font-family="monospace" font-size="8" fill="#38bdf8" fill-opacity="0.6" stroke="none" letter-spacing="1">SYS_NODE_04</text>
        </g>
    </g>
</svg>
