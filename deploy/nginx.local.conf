events {
    worker_connections 1024;
}

http {
    upstream backend_app {
        # Using Docker's internal DNS to reach the app containers
        server app1:80;
        server app2:80;
    }

    server {
        listen 80;
        
        # En el futuro, aquí puedes configurar los certificados SSL (Let's Encrypt)
        # y redirigir el tráfico del puerto 80 al 443.

        location / {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Websocket proxy (si tienes un solo websocket server)
        # location /ws {
        #     proxy_pass http://websocket_server:8765;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "Upgrade";
        # }
    }
}
