events {
    worker_connections 10000;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # ==============================================================================
    # UPSTREAMS (Reemplazar con las IPs PRIVADAS de tus VPS)
    # ==============================================================================
    
    # Servidores Web PHP (VPS 2, VPS 3, etc.)
    upstream backend_php {
        server 10.0.0.2:80;
        # server 10.0.0.3:80;
    }

    # Microservicio Go de Chunks de Lienzo (VPS 2, VPS 3, etc.)
    upstream backend_go {
        server 10.0.0.2:8080;
        # server 10.0.0.3:8080;
    }

    # Servidor WebSocket en Rust (VPS 4)
    upstream backend_ws {
        server 10.0.0.4:8765;
    }

    # ==============================================================================
    # SERVIDOR HTTP / HTTPS PRINCIPAL
    # ==============================================================================
    server {
        listen 80;
        server_name localhost; # Reemplazar con tudominio.com

        # Tráfico Web General (PHP)
        location / {
            proxy_pass http://backend_php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Extracción acelerada de Chunks de Lienzo (Go)
        location /api/go/ {
            proxy_pass http://backend_go/api/go/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==============================================================================
    # SERVIDOR WEBSOCKET (Puerto 8765)
    # ==============================================================================
    server {
        listen 8765;
        server_name localhost; # Reemplazar con tudominio.com

        location / {
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
