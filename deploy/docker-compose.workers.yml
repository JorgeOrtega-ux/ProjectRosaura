services:
  # ==========================================
  # SERVIDOR WEBSOCKET (Rust)
  # ==========================================
  websocket_node:
    build:
      context: ../
      dockerfile: docker/rust/Dockerfile.worker
    container_name: spriteboard_websocket_node_rust
    restart: always
    ports:
      - "${WS_BIND_IP:-127.0.0.1}:${WS_PORT:-8765}:${WS_PORT:-8765}"
    env_file:
      - ../.env.ws
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - spriteboard_workers_network

  # ==========================================
  # WORKERS DE PYTHON EN SEGUNDO PLANO
  # ==========================================
  worker_backups:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: spriteboard_worker_backups
    restart: always
    command: python -u scripts/workers/worker_backups.py
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - spriteboard_workers_network

  worker_system_tasks:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: spriteboard_worker_system_tasks
    restart: always
    command: python -u scripts/workers/worker_system_tasks.py
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - spriteboard_workers_network

  worker_persistence:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: spriteboard_worker_persistence
    restart: always
    command: python -u scripts/workers/worker_persistence.py
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - spriteboard_workers_network

  worker_canvas_jobs:
    build:
      context: ../
      dockerfile: docker/python/Dockerfile.worker
    container_name: spriteboard_worker_canvas_jobs
    restart: always
    command: python -u scripts/workers/worker_canvas_jobs.py
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
      - PALETTES_FILE_PATH=/app/public/assets/data/palettes.json
    networks:
      - spriteboard_workers_network

networks:
  spriteboard_workers_network:
    driver: bridge
