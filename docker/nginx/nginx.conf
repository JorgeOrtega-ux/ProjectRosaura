worker_processes auto;

events {
    worker_connections 10000;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Resolver DNS interno de Docker - resuelve hostnames dinámicamente
    # Evita el error "host not found in upstream" al arrancar
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Upstream para los servidores PHP
    upstream php_cluster {
        server app1:80;
        server app2:80;
    }

    # Servidor HTTP Principal (PHP)
    server {
        listen 80;
        server_name localhost; # Ajustar en prod

        location / {
            proxy_pass http://php_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/go/ {
            proxy_pass http://go_service:8080/api/go/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Servidor WebSocket (Mantiene el mismo puerto para no romper el frontend)
    server {
        listen 8765;
        server_name localhost;

        location / {
            # Variable para resolución dinámica via DNS de Docker
            set $ws_upstream http://rosaura_websocket_node_rust:8765;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ajustes para websockets que no se corten por inactividad tan rápido
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
