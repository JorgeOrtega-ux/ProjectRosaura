<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#05060d"/>
            <stop offset="40%" stop-color="#0b0e1e"/>
            <stop offset="80%" stop-color="#11132b"/>
            <stop offset="100%" stop-color="#181534"/>
        </linearGradient>

        <!-- Aurora Glow Radials -->
        <radialGradient id="glowViolet" cx="75%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.38"/>
            <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#0b0e1e" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="glowCyan" cx="30%" cy="80%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
            <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#05060d" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="glowPink" cx="90%" cy="85%" r="45%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
            <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Linear Wave Gradients -->
        <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
            <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.4"/>
            <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
            <stop offset="40%" stop-color="#6366f1" stop-opacity="0.35"/>
            <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </linearGradient>

        <!-- Grid Pattern -->
        <pattern id="gridPattern1" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
        </pattern>
    </defs>

    <!-- Base Canvas -->
    <rect width="1200" height="320" fill="url(#auroraBg)"/>

    <!-- Subtle Grid Overlay -->
    <rect width="1200" height="320" fill="url(#gridPattern1)"/>

    <!-- Glowing Orbs -->
    <rect width="1200" height="320" fill="url(#glowViolet)"/>
    <rect width="1200" height="320" fill="url(#glowCyan)"/>
    <rect width="1200" height="320" fill="url(#glowPink)"/>

    <!-- Aurora Waves / Ribbons -->
    <path d="M-100,240 C200,100 450,300 750,160 C980,50 1150,140 1300,100" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-100,260 C220,130 470,320 770,180 C1000,70 1170,160 1300,120" fill="none" stroke="url(#streamGrad1)" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="6 4"/>
    <path d="M-50,120 C250,260 550,80 850,220 C1050,310 1200,210 1300,240" fill="none" stroke="url(#streamGrad2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-50,100 C230,240 530,60 830,200 C1030,290 1180,190 1300,220" fill="none" stroke="url(#streamGrad2)" stroke-width="0.75" stroke-opacity="0.5"/>

    <!-- Minimal Geometric Details & Constellation Coordinates -->
    <g stroke="#ffffff" stroke-opacity="0.25" fill="none">
        <!-- Technical Crosshairs -->
        <g transform="translate(1080, 70)">
            <circle cx="0" cy="0" r="28" stroke-width="0.75" stroke-dasharray="3 3" stroke-opacity="0.2"/>
            <circle cx="0" cy="0" r="14" stroke-width="0.75"/>
            <circle cx="0" cy="0" r="3" fill="#a78bfa" fill-opacity="0.8" stroke="none"/>
            <line x1="-36" y1="0" x2="36" y2="0" stroke-width="0.75"/>
            <line x1="0" y1="-36" x2="0" y2="36" stroke-width="0.75"/>
            <text x="18" y="-18" font-family="monospace" font-size="9" fill="#a78bfa" fill-opacity="0.7" stroke="none" letter-spacing="1">RA 18h / DEC +36°</text>
        </g>

        <!-- Secondary Crosshair -->
        <g transform="translate(480, 75)">
            <circle cx="0" cy="0" r="8" stroke-width="0.75"/>
            <line x1="-14" y1="0" x2="14" y2="0" stroke-width="0.5"/>
            <line x1="0" y1="-14" x2="0" y2="14" stroke-width="0.5"/>
        </g>

        <!-- Orbital Nodes -->
        <g transform="translate(850, 190)">
            <ellipse cx="0" cy="0" rx="60" ry="18" stroke-width="0.75" stroke-dasharray="4 4" transform="rotate(-20)" stroke-opacity="0.3"/>
            <circle cx="48" cy="-12" r="3" fill="#38bdf8" fill-opacity="0.9" stroke="none"/>
            <circle cx="-42" cy="14" r="2" fill="#c084fc" fill-opacity="0.7" stroke="none"/>
        </g>
    </g>

    <!-- Star Dust Particles -->
    <g fill="#ffffff">
        <circle cx="150" cy="80" r="1" opacity="0.4"/>
        <circle cx="280" cy="190" r="1.5" opacity="0.6"/>
        <circle cx="390" cy="60" r="1" opacity="0.3"/>
        <circle cx="620" cy="240" r="1.5" opacity="0.5"/>
        <circle cx="710" cy="90" r="2" opacity="0.7"/>
        <circle cx="940" cy="140" r="1" opacity="0.4"/>
        <circle cx="1020" cy="270" r="1.5" opacity="0.6"/>
        <circle cx="1140" cy="180" r="1" opacity="0.5"/>
        <circle cx="80" cy="220" r="1.2" opacity="0.3"/>
    </g>
</svg>
