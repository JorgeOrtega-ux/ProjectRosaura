worker_processes auto;

events {
    worker_connections 10000;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream para los servidores PHP
    upstream php_cluster {
        server app1:80;
        server app2:80;
    }

    # Upstream para los servidores WebSocket (VPS Externos)
    upstream ws_cluster {
        # El VPS de 8GB recibe el doble de tráfico que el VPS de 4GB usando weights
        server IP_VPS_8GB:8765 weight=2 max_fails=5 fail_timeout=30s;
        server IP_VPS_4GB:8765 weight=1 max_fails=5 fail_timeout=30s;
    }

    # Servidor HTTP Principal (PHP)
    server {
        listen 80;
        server_name localhost; # Ajustar en prod

        location / {
            proxy_pass http://php_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Servidor WebSocket (Mantiene el mismo puerto para no romper el frontend)
    server {
        listen 8765;
        server_name localhost;

        location / {
            proxy_pass http://ws_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Ajustes para websockets que no se corten por inactividad tan rápido
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
