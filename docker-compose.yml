
services:
  # ==========================================
  # SERVICIOS BASE (APP, MYSQL, REDIS, TYPESENSE)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: rosaura_nginx
    restart: always
    ports:
      - "80:80"
      - "${WS_PORT:-8765}:${WS_PORT:-8765}"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
    networks:
      - rosaura_network

  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rosaura_app1
    volumes:
      - .:/var/www/html
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      db_cassandra:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  app2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rosaura_app2
    volumes:
      - .:/var/www/html
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      db_cassandra:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  go_service:
    build:
      context: ./docker/go
      dockerfile: Dockerfile
    container_name: rosaura_go_service
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  db_mysql:
    image: mysql:8.0
    container_name: rosaura_db_mysql
    restart: always
    command: --max_allowed_packet=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_IDENTITY_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d 
    networks:
      - rosaura_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  redis:
    image: redis:alpine
    container_name: rosaura_redis
    restart: always
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    command: redis-server --requirepass "${REDIS_PASS}" --appendonly yes
    env_file:
      - .env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rosaura_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: rosaura_typesense
    restart: always
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - rosaura_network

  # ==========================================
  # WORKERS DE PYTHON 
  # ==========================================
  
  worker_backups:
    build:
      context: .
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_backups
    restart: always
    command: python -u scripts/workers/worker_backups.py
    volumes:
      - .:/app
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_cassandra:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  worker_system_tasks:
    build:
      context: .
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_system_tasks
    restart: always
    command: python -u scripts/workers/worker_system_tasks.py
    volumes:
      - .:/app
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  worker_persistence:
    build:
      context: .
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_persistence
    restart: always
    command: python -u scripts/workers/worker_persistence.py
    volumes:
      - .:/app
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_cassandra:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  worker_canvas_jobs:
    build:
      context: .
      dockerfile: docker/python/Dockerfile.worker
    container_name: rosaura_worker_canvas_jobs
    restart: always
    command: python -u scripts/workers/worker_canvas_jobs.py
    volumes:
      - .:/app
    depends_on:
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
      - PALETTES_FILE_PATH=/app/public/assets/data/palettes.json
    networks:
      - rosaura_network


  # ==========================================
  # SERVIDOR WEBSOCKET (Rust)
  # ==========================================
  websocket_node:
    build:
      context: .
      dockerfile: docker/rust/Dockerfile.worker
    container_name: rosaura_websocket_node_rust
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db_mysql:
        condition: service_healthy
    env_file:
      - .env.ws
    environment:
      - TZ=${APP_TIMEZONE:-UTC}
    networks:
      - rosaura_network

  # ==========================================
  # SERVIDOR MINIO (Object Storage Amazon S3 Mock)
  # ==========================================
  minio:
    image: minio/minio
    container_name: rosaura_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-password}
    entrypoint: >
      /bin/sh -c "
      (/bin/sh -c '
        until /usr/bin/mc alias set myminio http://localhost:9000 $${AWS_ACCESS_KEY_ID:-admin} $${AWS_SECRET_ACCESS_KEY:-password}; do
          echo Waiting for MinIO to be ready;
          sleep 1;
        done;
        /usr/bin/mc mb myminio/$${AWS_BUCKET:-rosaura-storage} || true;
        /usr/bin/mc anonymous set download myminio/$${AWS_BUCKET:-rosaura-storage} || true;
      ') &
      exec /usr/bin/docker-entrypoint.sh minio server /data --console-address ':9001'
      "
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rosaura_network

  db_cassandra:
    image: cassandra:4.1
    container_name: rosaura_db_cassandra
    restart: always
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - rosaura_network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ==========================================
  # SERVICIO IA OLLAMA (Soporte Técnico)
  # ==========================================
  rosaura_ollama:
    image: ollama/ollama:latest
    container_name: rosaura_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rosaura_network
    restart: unless-stopped
    # IMPORTANTE: Sin 'ports' — solo accesible dentro de la red Docker
    # Para descargar el modelo la primera vez:
    #   docker exec rosaura_ollama ollama pull qwen3:1.7b

networks:
  rosaura_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  typesense_data:
  minio_data:
  cassandra_data:
  ollama_data:
